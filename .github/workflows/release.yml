name: Release VS Code extension

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag is the version every part carries
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm run version:check
          test "$TAG" = "v$(node -p "require('./packages/cli/package.json').version")" || { echo "The tag $TAG isn't v<version>: set the version with npm run version:set, or tag it v<version>."; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
      - name: Upload .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" editors/vscode/tfscript-vscode.vsix
